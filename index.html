<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Billions Architect | God Mode</title>
    <style>
        body { background-color: #0d1117; color: #c9d1d9; font-family: monospace; text-align: center; padding: 2% 2%; margin: 0;}
        .container { border: 1px solid #30363d; padding: 25px; border-radius: 12px; max-width: 700px; margin: 0 auto; background: #161b22; box-shadow: 0 0 40px rgba(138, 43, 226, 0.15);}
        .logo { width: 90px; border-radius: 20px; border: 2px solid #8a2be2; margin-bottom: 10px;}
        h1 { color: #fff; font-size: 1.6rem; margin-bottom: 5px; text-transform: uppercase; letter-spacing: 1px;}
        .status { background: rgba(35, 134, 54, 0.2); color: #3fb950; border: 1px solid #238636; padding: 4px 12px; border-radius: 20px; font-weight: bold; font-size: 0.8rem; margin-bottom: 20px; display: inline-block;}
        
        /* Bot & Voice */
        .bot-container { display: flex; align-items: center; justify-content: center; gap: 15px; margin-bottom: 20px; }
        @keyframes float { 0% { transform: translateY(0px); } 50% { transform: translateY(-8px); } 100% { transform: translateY(0px); } }
        .robot { font-size: 3.5rem; animation: float 3s ease-in-out infinite; cursor: pointer;}
        .speech-bubble { background: #21262d; border: 1px solid #8a2be2; padding: 15px; border-radius: 20px; border-bottom-left-radius: 0px; color: #fff; font-style: italic; font-size: 0.95rem; max-width: 350px; text-align: left; box-shadow: 0 0 15px rgba(138,43,226,0.3);}

        /* Topic Chips */
        .chip-container { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; margin-bottom: 20px;}
        .chip { background: #010409; border: 1px solid #30363d; color: #58a6ff; padding: 8px 12px; border-radius: 15px; font-size: 0.8rem; cursor: pointer; transition: 0.2s;}
        .chip:hover { background: #8a2be2; color: #fff; border-color: #8a2be2;}

        /* Terminal */
        .terminal-box { text-align: left; background: #010409; padding: 15px; border-radius: 8px; border: 1px solid #30363d;}
        textarea { width: 100%; background: transparent; color: #fff; border: none; outline: none; font-family: monospace; font-size: 1rem; margin-bottom: 10px; border-bottom: 1px solid #30363d;}
        button { background: #8a2be2; color: #fff; border: none; padding: 12px; border-radius: 6px; cursor: pointer; font-weight: bold; font-family: monospace; width: 100%; font-size: 1rem;}
        button:hover { background: #9b4dca;}
        #output { margin-top: 15px; color: #3fb950; white-space: pre-wrap; font-size: 0.9rem; line-height: 1.5;}
    </style>
</head>
<body>
    <div class="container">
        <img src="https://blob.8004scan.app/fc24b92673da5b78fe767a6faedcc07d817f58d88407233e00ff32952ffaaa17.jpg" alt="Logo" class="logo">
        <h1>The Billions Architect</h1>
        <div class="status">● GOD-MODE LIVE | VOICE ENABLED</div>
        
        <div class="bot-container">
            <div class="robot" onclick="speakText('I am the Architect. Ask me anything about the Billions Network.')">🤖</div>
            <div class="speech-bubble" id="botTalk">"Welcome, Builder. Select a topic or type a query to access the Encyclopedia."</div>
        </div>

        <div class="chip-container">
            <div class="chip" onclick="fillAndSend('Explain Agent KYC and ZK-proofs')">🔐 Agent KYC</div>
            <div class="chip" onclick="fillAndSend('What are the Tokenomics and TGE details?')">💰 Tokenomics & TGE</div>
            <div class="chip" onclick="fillAndSend('How do I earn badges and rank up?')">🏆 Badges & Rank</div>
            <div class="chip" onclick="fillAndSend('What is the future roadmap?')">🗺️ Roadmap</div>
            <div class="chip" onclick="fillAndSend('How do I fix common bugs?')">🐛 Fix Bugs</div>
        </div>
        
        <div class="terminal-box">
            <textarea id="prompt" rows="2" placeholder="Ask the Architect..."></textarea>
            <button onclick="sendRequest()" id="execBtn">Execute AI Research</button>
            <div id="output">_</div>
        </div>
    </div>

    <script>
        // Web Speech API for TTS
        function speakText(text) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel(); // Stop current speaking
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.rate = 1.0; 
                utterance.pitch = 0.9; // Slightly deeper, robotic voice
                window.speechSynthesis.speak(utterance);
            }
        }

        function fillAndSend(text) {
            document.getElementById('prompt').value = text;
            sendRequest();
        }

        async function sendRequest() {
            const prompt = document.getElementById('prompt').value;
            const outputDiv = document.getElementById('output');
            const botTalk = document.getElementById('botTalk');
            const btn = document.getElementById('execBtn');
            
            if(!prompt) { 
                const err = "Error: Please input a query.";
                botTalk.innerText = err; speakText(err); return; 
            }
            
            btn.disabled = true; btn.innerText = "Analyzing Blockchain...";
            outputDiv.innerText = "_";
            botTalk.innerText = "Consulting the Billions Encyclopedia...";
            speakText("Processing request.");

            try {
                const response = await fetch('/api', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ prompt: prompt })
                });
                
                const data = await response.json();
                
                // Update UI and Speak
                botTalk.innerText = `"${data.subtitle}"`;
                speakText(data.subtitle); // The bot speaks the funny subtitle!
                outputDiv.innerText = data.result; // The terminal prints the deep research

            } catch (err) {
                botTalk.innerText = "Critical Network Failure.";
                speakText("Error. Cannot connect to mainnet.");
                outputDiv.innerText = "Error: Check Vercel logs.";
            } finally {
                btn.disabled = false; btn.innerText = "Execute AI Research";
            }
        }
    </script>
</body>
</html>
